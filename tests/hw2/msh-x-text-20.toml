image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1400000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo 12345678901234567890\necho 123456789012345678901\necho 1234567890123456789 x\n"

[assert]
uart0_contains = "msh> 12345678901234567890\nmsh> msh> msh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
mmu_enabled = true
